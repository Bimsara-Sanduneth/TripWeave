services:
  postgres:
    image: postgres:17
    container_name: tripweave-postgres

    environment:
      POSTGRES_DB: tripweave_dev
      POSTGRES_USER: tripweave
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
